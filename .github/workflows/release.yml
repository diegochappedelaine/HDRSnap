name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test
        run: dotnet test tests/HDRSnap.Tests -c Release
      - name: Publish
        run: dotnet publish HDRSnap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o publish
      - name: Release
        run: gh release create ${{ github.ref_name }} publish/HDRSnap.exe --title "HDRSnap ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
